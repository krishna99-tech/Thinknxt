name: thinknxt-web

services:
  thinknxt-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INTERNAL_BACKEND_URL: ${INTERNAL_BACKEND_URL:-http://thingsnxt-backend:8000}
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws}
    image: thingsnxt-thinknxt-web:latest
    container_name: thingsnxt-thinknxt-web
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - HOSTNAME=0.0.0.0
      - INTERNAL_BACKEND_URL=${INTERNAL_BACKEND_URL:-http://thingsnxt-backend:8000}
      - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-/api}
      - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-/ws}
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  app-network:
    name: app-network
    external: true

